apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: product-order-ingress
  namespace: product-order-system
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
  - host: localhost
    http:
      paths:
      # User Service Routes
      - path: /users
        pathType: Prefix
        backend:
          service:
            name: user-service
            port:
              number: 3001
      
      - path: /auth
        pathType: Prefix
        backend:
          service:
            name: user-service
            port:
              number: 3001
      
      # Product Service Routes
      - path: /products
        pathType: Prefix
        backend:
          service:
            name: product-service
            port:
              number: 3002
      
      # Order Service Routes
      - path: /orders
        pathType: Prefix
        backend:
          service:
            name: order-service
            port:
              number: 3003
      
      # Health Check Routes
      - path: /health
        pathType: Prefix
        backend:
          service:
            name: user-service
            port:
              number: 3001
